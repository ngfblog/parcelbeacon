{% extends "base.html" %}
{% block title %}כניסה · ParcelBeacon{% endblock %}
{% block content %}
<section class="panel narrow">
  <h1>כניסה למערכת</h1>
  <form method="post" class="stack">
    <label>שם משתמש<input name="username" autocomplete="username" required></label>
    <label>סיסמה<input type="password" name="password" autocomplete="current-password" required></label>
    <button type="submit">כניסה</button>
  </form>
</section>
{% endblock %}
