<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}ParcelBeacon{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <a class="brand" href="{{ url_for('index') }}">📦 ParcelBeacon</a>
    <nav class="header-actions">
      <a class="header-link" href="{{ url_for('account_settings') }}">הגדרות חשבון</a>
      {% if session.get('authenticated') %}
      <form method="post" action="{{ url_for('logout') }}"><button class="link-button">יציאה</button></form>
      {% endif %}
    </nav>
  </header>
  <main>
    {% for category, message in get_flashed_messages(with_categories=true) %}
      <div class="flash {{ category }}">{{ message }}</div>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
